[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmwatch"
version = "0.0.1"
description = "A flight recorder for AI agent swarms — live, animated, framework-agnostic agent observability over OpenTelemetry."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Paul Bergeron" }]
keywords = ["llm", "agents", "observability", "opentelemetry", "tracing", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "duckdb>=1.0",
    "pydantic>=2.6",
    "opentelemetry-proto>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]
sdk = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.scripts]
swarmwatch = "swarmwatch.cli:main"

[project.urls]
Homepage = "https://github.com/pb-commits-it/swarmwatch"
Repository = "https://github.com/pb-commits-it/swarmwatch"

[tool.hatch.build.targets.wheel]
packages = ["swarmwatch"]

[tool.ruff]
line-length = 100
target-version = "py311"
